id: comment-markdown-editor
name: Markdown Comment Editor
version: 1.0.0
author: DLGrass
description: Adds Markdown editing and live preview to workspace comments. Supports headings, bold, italic, strikethrough, highlight, inline and fenced code, nested quotes, ordered/unordered/task lists with nesting, tables with alignment, images, links and autolinks, with Ctrl+M to toggle between edit and preview modes.
license: MIT

icon: assets/icon.svg
main: main.js
files:
  - markdown.js

astratch:
  version: '>=0.0.0'
  settings:
    - name: default mode
      id: defaultMode
      type: string
      default: edit
      description: Which mode a newly opened comment starts in. Use "edit" or "preview".
    - name: toggle shortcut
      id: shortcut
      type: string
      default: Ctrl+M
      description: Keyboard shortcut used to switch between edit and preview mode, e.g. Ctrl+M or Alt+M.
    - name: render raw HTML
      id: allowHtml
      type: boolean
      default: false
      description: When enabled, raw HTML inside comments is passed through instead of being escaped. Only enable for trusted projects.
    - name: show mode indicator
      id: showIndicator
      type: boolean
      default: true
      description: Show the small mode label next to the toggle button in the comment top bar.
